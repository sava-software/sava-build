org.gradle.configuration-cache=true
org.gradle.caching=true
# Repeated Kotlin build configuration can exhaust Gradle's 384 MiB metaspace default.
# Retain the default heap limit while avoiding daemon expiry during repeated builds.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# The dependency verification policy's declaration, which the guard requires beside the policy:
# Gradle's default while gradle/verification-metadata.xml is present and nothing without it, so
# the line changes nothing for Gradle and fails check should the file go missing. Relax the mode
# only on a command line, never here.
org.gradle.dependency.verification=strict
kotlin.daemon.jvmargs=-Xmx1024m

# activate once it works reliably in IntelliJ
# https://docs.gradle.org/current/userguide/isolated_projects.html
