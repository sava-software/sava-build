name: Gradle Check PR

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      READ_SAVA_PACKAGES:
        description: Token used to read sava GitHub Packages.
        required: false

jobs:
  # pull_request_target is let THROUGH the condition so the first step can fail
  # the 'check' context itself: a skipped job satisfies a required status check,
  # so skipping (the old shape) or a sibling guard job would let a protected
  # branch merge the very misconfiguration being guarded against — checkout
  # resolving the BASE branch and inherited secrets reaching fork PRs. Bot
  # authors (release-please, dependabot) still skip under either event, so a
  # bot-authored PR cannot surface the misconfiguration — the guard fires on
  # the first human PR, and the dangerous fork case always has a human author.
  check:
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.pull_request.user.login != 'sava-release-please[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::check-pr.yml was invoked from a pull_request_target event: checkout resolves the base branch, so the PR's changes are never built, and 'secrets: inherit' is exposed to fork PRs. Trigger on pull_request instead."
          exit 1
      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      # Outside contributors never change the build: maintainers bump dependencies,
      # plugins and the wrapper, add or change requires directives, and edit release
      # configuration and workflows. A pull request from a fork runs the workflow files of
      # its own branch, so this tells an honest contributor early; it cannot stop a hostile
      # one, which review does.
      - name: Refuse build and dependency changes from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          # The requires directives of a module-info.java at a commit, one per line, sorted.
          # Comments are removed in one left-to-right pass; one that holds only "runtime"
          # (/*runtime*/ or //runtime), which the module plugin reads as a runtime-only
          # dependency, becomes a modifier. Whitespace and modifiers are normalized and JDK
          # modules left out. A file that does not exist at that commit has none.
          requires_of() {
            git cat-file -e "$1:$2" 2>/dev/null || return 0
            git show "$1:$2" | python3 -I -c '
          import re, sys
          def comment(match):
              text = match.group(0)
              inner = text[2:] if text.startswith("//") else text[2:-2]
              return " runtime " if inner.strip() == "runtime" else " "
          src = re.sub(r"//[^\n]*|/\*.*?\*/", comment, sys.stdin.read(), flags=re.S)
          found = set()
          for m in re.finditer(r"(?<![\w$.])requires\s+((?:(?:static|transitive|runtime)\s+)*)([A-Za-z_$][\w$]*(?:\s*\.\s*[A-Za-z_$][\w$]*)*)\s*;", src):
              name = re.sub(r"\s+", "", m.group(2))
              if not name.startswith(("java.", "jdk.")):
                  found.add(" ".join(sorted(m.group(1).split()) + [name]))
          print("\n".join(sorted(found)))
          ' | sed '/^$/d' | LC_ALL=C sort
          }
          protected() {
            case "$1" in
              .github|.github/*|gradle|gradle/*|buildSrc|buildSrc/*|build-logic|build-logic/*) return 0 ;;
              gradlew|gradlew.bat|*.gradle|*.gradle.kts|*.versions.toml) return 0 ;;
              gradle.properties|*/gradle.properties) return 0 ;;
              release-please-config.json|.release-please-manifest.json) return 0 ;;
            esac
            return 1
          }
          # The checkout is the merge commit at depth 1; its first parent is the base. The
          # list goes through a file so a failing git command fails the step, and without
          # rename detection a protected file moved elsewhere still lists its old path.
          git fetch --quiet --no-tags --depth=2 origin "$GITHUB_SHA"
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/pr-changed-paths"
          refused=0
          while IFS= read -r -d '' path; do
            reason=
            if protected "$path"; then
              reason="dependency, build, release and workflow changes come from maintainers"
            elif [[ "$path" == module-info.java || "$path" == */module-info.java ]]; then
              # The module plugin reads dependencies from requires directives, so an added,
              # removed or changed one on a module outside the JDK is a dependency change.
              # Both versions are read whole: a directive can span lines or share one.
              # Through files, so a failing read fails the step.
              requires_of HEAD^1 "$path" > "$RUNNER_TEMP/requires-was"
              requires_of HEAD "$path" > "$RUNNER_TEMP/requires-now"
              changed=$(LC_ALL=C comm -3 "$RUNNER_TEMP/requires-was" "$RUNNER_TEMP/requires-now" |
                awk -F '\t' '{ printf "%s%s", (NR > 1 ? ", " : ""), ($1 == "" ? "now " $2 : "was " $1) }')
              if [ -n "$changed" ]; then
                reason="it changes requires directives ($changed), and dependency changes come from maintainers"
              fi
            fi
            [ -n "$reason" ] || continue
            refused=1
            path=${path//'%'/%25}; path=${path//$'\r'/%0D}; path=${path//$'\n'/%0A}
            echo "::error::A pull request from a fork may not change $path: $reason."
          done < "$RUNNER_TEMP/pr-changed-paths"
          exit "$refused"

      # A pull request from a fork gets no secrets, so it cannot read GitHub Packages.
      # A non-blank placeholder makes the build declare those repositories, and
      # --offline resolves everything from main's Gradle cache, which the setup action
      # restored read-only. A dependency that is not in that cache fails the build.
      - name: Gradle Check
        shell: bash
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
        run: |
          offline=()
          if [[ "$FORK_PR" == true ]]; then
            export ORG_GRADLE_PROJECT_savaGithubPackagesPassword=fork-pr-offline
            offline=(--offline)
            echo "::notice::Pull request from a fork: it receives no secrets, so Gradle resolves offline from main's Gradle cache."
          fi
          ./gradlew --stacktrace "${offline[@]}" -PjavaVersion="$SETUP_JAVA_VERSION" check || {
            rc=$?
            if [[ "$FORK_PR" == true ]]; then
              echo "::error::If the offline build failed with 'No cached version' or 'Plugin ... was not found', main's Gradle cache lacks something this run's merge commit needs. Either this pull request adds a dependency (a requires in module-info.java, say), which a pull request from a fork may not do; or main's dependencies changed after this run's merge commit was made, so the pull request needs a new merge commit (push to it, use Update branch, or close and reopen it), since a re-run reuses the same merge commit; or GitHub evicted main's cache (unused for 7 days, or the repository's cache is full): then a maintainer builds main and re-runs this job."
            fi
            exit "$rc"
          }
