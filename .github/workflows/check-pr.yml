name: Gradle Check PR

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      READ_SAVA_PACKAGES:
        description: Token used to read sava GitHub Packages.
        required: false

jobs:
  # pull_request_target is let THROUGH the condition so the first step can fail
  # the 'check' context itself: a skipped job satisfies a required status check,
  # so skipping (the old shape) or a sibling guard job would let a protected
  # branch merge the very misconfiguration being guarded against — checkout
  # resolving the BASE branch and inherited secrets reaching fork PRs. Bot
  # authors (release-please, dependabot) still skip under either event, so a
  # bot-authored PR cannot surface the misconfiguration — the guard fires on
  # the first human PR, and the dangerous fork case always has a human author.
  check:
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.pull_request.user.login != 'sava-release-please[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::check-pr.yml was invoked from a pull_request_target event: checkout resolves the base branch, so the PR's changes are never built, and 'secrets: inherit' is exposed to fork PRs. Trigger on pull_request instead."
          exit 1
      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      # Outside contributors never change the build: maintainers bump dependencies,
      # plugins and the wrapper, add or change requires directives, and edit release
      # configuration and workflows. The guard reads requires directives with a Java
      # program it compiles on the JDK the setup step installed.
      - uses: sava-software/sava-build/.github/actions/fork-pr-guard@main
        if: github.event.pull_request.head.repo.full_name != github.repository

      # A pull request from a fork gets no secrets, so it cannot read GitHub Packages.
      # A non-blank placeholder makes the build declare those repositories, and
      # --offline resolves everything from main's Gradle cache, which the setup action
      # restored read-only. A dependency that is not in that cache fails the build.
      - name: Gradle Check
        shell: bash
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
        run: |
          offline=()
          if [[ "$FORK_PR" == true ]]; then
            export ORG_GRADLE_PROJECT_savaGithubPackagesPassword=fork-pr-offline
            offline=(--offline)
            echo "::notice::Pull request from a fork: it receives no secrets, so Gradle resolves offline from main's Gradle cache."
          fi
          ./gradlew --stacktrace "${offline[@]}" -PjavaVersion="$SETUP_JAVA_VERSION" check || {
            rc=$?
            if [[ "$FORK_PR" == true ]]; then
              echo "::error::If the offline build failed with 'No cached version', 'Plugin ... was not found' or 'Dependency verification failed', main's Gradle cache lacks something this run's merge commit needs: an artifact, or the signature file dependency verification checks it against, which the first main build after this repository adopted its policy fetched into the cache. Either this pull request adds a dependency (a requires in module-info.java, say), which a pull request from a fork may not do; or main's dependencies or its verification policy changed after this run's merge commit was made, so the pull request needs a new merge commit (push to it, use Update branch, or close and reopen it), since a re-run reuses the same merge commit; or GitHub evicted main's cache (unused for 7 days, or the repository's cache is full): then a maintainer builds main and re-runs this job."
            fi
            exit "$rc"
          }
