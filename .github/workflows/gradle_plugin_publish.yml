name: Publish Gradle Plugin

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests run in a separate workflow passed only READ_SAVA_PACKAGES; the publish job below
  # builds the plugin again without running tests.
  check:
    uses: ./.github/workflows/gradle_plugin_release_check.yml
    permissions:
      contents: read
    secrets:
      READ_SAVA_PACKAGES: ${{ secrets.READ_SAVA_PACKAGES }}

  publish:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    # The tag reaches the scripts below only through this variable, never pasted
    # into a run script: release-please cuts it from the merged release PR's title,
    # which a Release-As commit footer or a title edit sets.
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # First, before checkout or any secret-bearing step: publish only a tag
      # push whose name is a plain X.Y.Z release version.
      - name: Validate release tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        # Fail-closed: under sh a negated test would let a malformed check pass.
        # Digits are listed, not ranged, so no locale widens what they match.
        run: |
          release_tag_re='^(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)$'
          [[ "$REF_TYPE" == tag ]] || { echo "::error::Publishing runs only on a release tag push; this run's ref type is '$REF_TYPE'."; exit 1; }
          [[ "$RELEASE_TAG" =~ $release_tag_re ]] || { echo "::error::Refusing to publish tag '$RELEASE_TAG': a release tag is a plain X.Y.Z version (digits only, no leading zeros, no prefix or suffix)."; exit 1; }

      # No Gradle cache: earlier builds, tests included, wrote it, and nothing they
      # left may reach the job that signs. Checkout persists no git credential for later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-disabled: true
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}

#      - name: Maven Central
#        run: ./gradlew --stacktrace -Psign=true -Pversion="$RELEASE_TAG" :publishCentralPortalDeployment
#        env:
#          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
#          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
#          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
#          MAVEN_CENTRAL_SECRET: ${{ secrets.MAVEN_CENTRAL_SECRET }}
#          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
#          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Github Packages
        run: ./gradlew --stacktrace --no-build-cache -Psign=true -Pversion="$RELEASE_TAG" :publishToGitHubPackages
        env:
          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '**/build/libs/*.jar'
