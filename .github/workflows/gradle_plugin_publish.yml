name: Publish Gradle Plugin

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}

      - name: Check release tooling
        run: |
          bash -n tools/local-fuzz.sh tools/release-attestation.sh
          tools/local-fuzz.sh --self-test
          tools/release-attestation.sh --self-test

      - name: Verify reviewed release attestation
        run: tools/release-attestation.sh verify-tag "${GITHUB_REF_NAME}"

      - name: Check
        run: ./gradlew --stacktrace --no-build-cache -Psign=true -Pversion=${{ github.ref_name }} check
        env:
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Verify built plugin matches certified candidate
        run: tools/release-attestation.sh verify-built-jar "${GITHUB_REF_NAME}" "build/libs/sava-build-${GITHUB_REF_NAME}.jar"

#      - name: Maven Central
#        run: ./gradlew --stacktrace -Psign=true -Pversion=${{ github.ref_name }} :publishCentralPortalDeployment
#        env:
#          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
#          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
#          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
#          MAVEN_CENTRAL_SECRET: ${{ secrets.MAVEN_CENTRAL_SECRET }}
#          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
#          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Github Packages
        run: ./gradlew --stacktrace -Psign=true -Pversion=${{ github.ref_name }} :publishToGitHubPackages
        env:
          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '**/build/libs/*.jar'
