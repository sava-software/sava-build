name: Gradle Dependency Submission

permissions:
  contents: read

on:
  push:
    branches: [ main ]

concurrency:
  group: dependency-submission-${{ github.ref }}
  # Finish an active submission before the latest pending main push starts.
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # oracle-actions/setup-java with the eMudhra trust checks around it; the action says why.
      - uses: ./.github/actions/setup-checked-jdk
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      - name: Refuse unresolved dependencies
        run: |
          cat > "$RUNNER_TEMP/dependency-graph-resolution-check.init.gradle" <<'EOF'
          import org.gradle.api.artifacts.DependencyResolutionListener
          import org.gradle.api.artifacts.ResolvableDependencies
          import org.gradle.api.artifacts.result.UnresolvedDependencyResult

          gradle.addListener(new DependencyResolutionListener() {
              void beforeResolve(ResolvableDependencies dependencies) {}

              void afterResolve(ResolvableDependencies dependencies) {
                  def unresolved = dependencies.resolutionResult.allDependencies.findAll {
                      it instanceof UnresolvedDependencyResult
                  }
                  if (!unresolved.empty) {
                      throw new GradleException("Cannot submit an incomplete dependency graph for " +
                          dependencies.path + ": " + unresolved.collect { it.attempted.displayName }.join(", "))
                  }
              }
          })
          EOF
      - name: Generate and upload dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        env:
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: sava-build-main-dependencies
        with:
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          cache-disabled: true
          # The action prepends verification=off; this later argument restores strict verification.
          additional-arguments: >-
            -Dorg.gradle.dependency.verification=strict
            --no-configuration-cache --stacktrace
            --init-script ${{ runner.temp }}/dependency-graph-resolution-check.init.gradle
      - name: Check dependency graph identity and coverage
        run: |
          shopt -s nullglob
          reports=(dependency-graph-reports/*.json)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::Expected one dependency snapshot, found ${#reports[@]}"
            exit 1
          fi
          snapshot="${reports[0]}"
          if ! jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
              '.sha == $sha and .ref == "refs/heads/main" and (.job.id | tostring) == $run' "$snapshot" > /dev/null; then
            echo "::error::Dependency snapshot does not describe this main push and workflow run"
            exit 1
          fi
          # Every resolved package URL without its qualifiers, once each.
          jq -r '[.manifests // {} | .[] | .resolved // {} | .[] | .package_url | split("?")[0]] | unique | .[]' \
            "$snapshot" > "$RUNNER_TEMP/packages"
          gradle_version=$(sed -nE 's#.*/gradle-(.+)-bin\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n 1)
          if ! grep -qxF "pkg:maven/org.gradle/gradle-core@$gradle_version" "$RUNNER_TEMP/packages"; then
            echo "::error::Dependency snapshot omits the configured Gradle version"
            exit 1
          fi
          for anchor in pkg:maven/com.autonomousapps/dependency-analysis-gradle-plugin@ pkg:maven/org.junit.jupiter/junit-jupiter@; do
            if ! awk -v anchor="$anchor" 'index($0, anchor) == 1 { found = 1 } END { exit !found }' "$RUNNER_TEMP/packages"; then
              echo "::error::Dependency snapshot omits expected build/test dependency: $anchor"
              exit 1
            fi
          done
          echo "Verified dependency snapshot for this main push: $(wc -l < "$RUNNER_TEMP/packages" | tr -d ' ') packages"

  submit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require this run's retained dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "dependency-graph_sava-build-main-dependencies.json" and .expired == false) | .id')
          if [[ ! "$artifact_ids" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected exactly one unexpired dependency graph artifact from this workflow run"
            exit 1
          fi
      # For a push event the action downloads artifacts from this workflow run only.
      # This job has no checkout, JDK setup, Gradle invocation, or repository scripts.
      - name: Download and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        env:
          DEPENDENCY_GRAPH_DOWNLOAD_ARTIFACT_NAME: sava-build-main-dependencies.json
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true
