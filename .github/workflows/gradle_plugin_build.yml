name: Gradle Check

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      - name: Check release tooling
        run: |
          bash -n tools/local-fuzz.sh
          tools/local-fuzz.sh --self-test
      - name: Gradle Check
        run: ./gradlew --stacktrace check
