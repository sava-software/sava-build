name: Gradle Check

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      # oracle-actions/setup-java with the eMudhra trust checks around it; the action says why.
      - uses: ./.github/actions/setup-checked-jdk
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      # TestKit has a separate Gradle home under the test worker directory.
      # Match files only: tar would recursively include excluded children if a
      # parent directory were in the manifest. Keep keys, locks and task outputs out.
      - name: Restore TestKit caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tmp/test/work/.gradle-test-kit/caches/**/*
            !build/tmp/test/work/.gradle-test-kit/caches/**/
            !build/tmp/test/work/.gradle-test-kit/caches/**/*.lock
            !build/tmp/test/work/.gradle-test-kit/caches/**/cc-keystore/**
            !build/tmp/test/work/.gradle-test-kit/caches/**/build-cache-*/**
          key: testkit-v1-${{ runner.os }}-${{ runner.arch }}-jdk${{ vars.GRADLE_JAVA_VERSION }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            testkit-v1-${{ runner.os }}-${{ runner.arch }}-jdk${{ vars.GRADLE_JAVA_VERSION }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-
      # check already includes the local-fuzz syntax check and self-test, and the tests of
      # the Java programs the composite actions under .github/actions run.
      - name: Gradle Check
        run: ./gradlew --stacktrace check

  # The jlink tests on a JDK without jmods, as every check of the plugin runs them; the
  # workflow says why.
  jlink-without-jmods:
    uses: ./.github/workflows/gradle_plugin_jlink_without_jmods.yml
