name: Release Check

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      manifest-file:
        description: release-please's manifest, as passed to release-please.yml; a release tag must be the version it names.
        required: false
        type: string
        default: .release-please-manifest.json
    secrets:
      READ_SAVA_PACKAGES:
        description: Token used to read sava GitHub Packages.
        required: false

# The check job of publish.yml and publish-gh.yml, kept in its own workflow and passed only
# READ_SAVA_PACKAGES (beside the job token, contents: read), so no publishing secret is in
# its secrets context. GitHub's docs say Actions "scrubs secrets from memory that are not
# referenced in the workflow", so a test job inside a workflow that references the signing
# secrets may reach them; running the tests, contributed ones included, in a workflow that
# references none is the conservative reading.
jobs:
  check:
    runs-on: ubuntu-latest

    # The tag reaches the scripts below only through this variable, never pasted
    # into a run script: release-please cuts it from the merged release PR's title,
    # which a Release-As commit footer or a title edit sets.
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # First, before checkout or setup: run only for a tag push whose name is a
      # plain X.Y.Z release version.
      - name: Validate release tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        # Fail-closed: under sh a negated test would let a malformed check pass.
        # Digits are listed, not ranged, so no locale widens what they match.
        run: |
          release_tag_re='^(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)$'
          [[ "$REF_TYPE" == tag ]] || { echo "::error::Publishing runs only on a release tag push; this run's ref type is '$REF_TYPE'."; exit 1; }
          [[ "$RELEASE_TAG" =~ $release_tag_re ]] || { echo "::error::Refusing to publish tag '$RELEASE_TAG': a release tag is a plain X.Y.Z version (digits only, no leading zeros, no prefix or suffix)."; exit 1; }

      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}
          release-manifest: ${{ inputs.manifest-file }}

      - name: Check
        run: ./gradlew --stacktrace -Psign=true -PjavaVersion="$SETUP_JAVA_VERSION" -Pversion="$RELEASE_TAG" check
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
