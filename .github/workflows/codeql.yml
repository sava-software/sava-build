name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        if: matrix.build-mode == 'manual'
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.build-mode == 'manual'
        with:
          cache-disabled: true
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        name: Initialize CodeQL
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          ram: 3072

      - name: Compile Classes
        if: matrix.build-mode == 'manual'
        # Compile the plugin sources under the tracer, including precompiled scripts.
        # Keep dependency verification strict; never regenerate trust metadata in CI.
        run: |
          ./gradlew --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx2g \
            -Pkotlin.daemon.jvmargs=-Xmx1500m \
            -Pkotlin.incremental=false \
            --max-workers=2 \
            --dependency-verification=strict \
            --no-build-cache \
            --no-configuration-cache \
            --rerun-tasks \
            classes

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        name: Perform CodeQL Analysis
        with:
          category: /language:${{ matrix.language }}
          ram: 3072
