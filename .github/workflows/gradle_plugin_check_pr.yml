name: Gradle Check PR

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: >
      github.event.pull_request.user.login != 'sava-release-please[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      # TestKit has a separate Gradle home under the test worker directory.
      # Match files only: tar would recursively include excluded children if a
      # parent directory were in the manifest. Keep keys, locks and task outputs out.
      - name: Restore TestKit caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/tmp/test/work/.gradle-test-kit/caches/**/*
            !build/tmp/test/work/.gradle-test-kit/caches/**/
            !build/tmp/test/work/.gradle-test-kit/caches/**/*.lock
            !build/tmp/test/work/.gradle-test-kit/caches/**/cc-keystore/**
            !build/tmp/test/work/.gradle-test-kit/caches/**/build-cache-*/**
          key: testkit-v1-${{ runner.os }}-${{ runner.arch }}-jdk${{ vars.GRADLE_JAVA_VERSION }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            testkit-v1-${{ runner.os }}-${{ runner.arch }}-jdk${{ vars.GRADLE_JAVA_VERSION }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-
      # check already includes the local-fuzz syntax check and self-test.
      # These independent checks share a runner; their failures still fail the job.
      - parallel:
          - name: Check the release-please guard
            run: |
              npm ci --prefix .github/actions/release-please-guard --ignore-scripts --no-audit --no-fund
              node --test .github/actions/release-please-guard/guard.test.mjs
          - name: Gradle Check PR
            run: ./gradlew --stacktrace check
