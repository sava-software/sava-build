name: Gradle Check PR

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-attestation:
    name: ${{ github.event.pull_request.draft && 'Release Attestation (draft)' || 'Release Attestation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Await ready-for-review
        if: ${{ github.event.pull_request.draft }}
        run: echo "Release attestation starts when this pull request is ready for review."

      - if: ${{ github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify reviewed release attestation in proposed release tree
        if: ${{ github.event.pull_request.draft == false }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          base_version=$(git show \
            "$base:.release-please-manifest.json" | \
            jq -er '.["."] | select(type == "string")')
          version=$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)
          if [ "$version" = "$base_version" ]; then
            echo "This pull request does not change the release version."
            exit 0
          fi
          relative="release-attestations/$version.json"
          seen_changelog=false
          seen_manifest=false
          seen_attestation=false
          while IFS= read -r -d '' path; do
            case "$path" in
              CHANGELOG.md) seen_changelog=true ;;
              .release-please-manifest.json) seen_manifest=true ;;
              "$relative") seen_attestation=true ;;
              *)
                echo "::error::Unexpected Release Please PR path: $path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z \
            "$base"...HEAD --)
          if ! $seen_changelog || ! $seen_manifest || ! $seen_attestation; then
            echo "::error::The Release Please PR must contain CHANGELOG.md, the manifest update, and $relative before merge."
            exit 1
          fi
          candidate=$(jq -er '.candidate.commit | select(type == "string")' "$relative")
          if [ "$candidate" != "$base" ]; then
            echo "::error::The reviewed candidate $candidate is not this pull request's base $base; update the branch and regenerate the attestation."
            exit 1
          fi
          bash -n tools/release-attestation.sh
          tools/release-attestation.sh verify "$version"

  check:
    if: >
      github.event.pull_request.user.login != 'sava-release-please[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}
      - name: Check release tooling
        run: |
          bash -n tools/local-fuzz.sh tools/release-attestation.sh
          tools/local-fuzz.sh --self-test
          tools/release-attestation.sh --self-test
      - name: Gradle Check PR
        run: ./gradlew --stacktrace check
