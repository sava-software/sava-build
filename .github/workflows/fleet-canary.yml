name: Fleet Canary

on:
  workflow_dispatch:
    inputs:
      deep:
        description: >
          Run the deep leg for manifest entries annotated deep=<pitestSuiteTask>
          (real mutation runs, minutes per suite).
        type: boolean
        default: false
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: fleet-canary-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # check-pr deliberately skips bot-authored PRs, so the release PR would merge
  # with nothing run against it; this job is the check that runs EXACTLY there —
  # the release-please PR — validating the consumer fleet against this
  # checkout's unreleased plugin. workflow_dispatch passes the condition for
  # manual runs (no pull_request payload to inspect). Same-repo PR authored by
  # release-please: plain pull_request checkout is safe.
  fleet-canary:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'sava-release-please[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b
        with:
          website: ${{ vars.JDK_SRC }}
          release: ${{ vars.GRADLE_JAVA_VERSION }}

      # Fresh --depth 1 clones: the canary validates each consumer's committed
      # state, never a dirty working tree. The manifest is the roster of record;
      # parsing is plain bash (skip '#' and blank lines, honour the optional
      # ` deep=<pitestSuiteTask>` annotation only when the deep input is true).
      # Clones authenticate with FLEET_CANARY_TOKEN when set (private fleet
      # repos need it; the default github.token reaches only THIS repo). A repo
      # that cannot be cloned is named loudly and recorded as NOT VALIDATED
      # instead of killing the run — a gate that is permanently red over a
      # missing secret gets disabled, and a canary record that silently omits a
      # repo is the false certification the resolution-notice check refuses.
      - name: Clone fleet
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_CANARY_TOKEN || github.token }}
        run: |
          set -euo pipefail
          deep='${{ inputs.deep }}'
          mkdir -p ../fleet
          : > ../fleet/canary-args.txt
          : > ../fleet/not-validated.txt
          while read -r slug annot _rest; do
            case "$slug" in ''|\#*) continue ;; esac
            case "$annot" in \#*) annot='' ;; esac
            repo="${slug##*/}"
            if ! git clone --depth 1 \
                "https://x-access-token:${FLEET_TOKEN}@github.com/$slug" "../fleet/$repo"; then
              echo "::warning::fleet-canary: cannot clone $slug — NOT VALIDATED this run" \
                "(private repo? set the FLEET_CANARY_TOKEN secret: a PAT with repo read)"
              printf '%s\n' "$slug" >> ../fleet/not-validated.txt
              continue
            fi
            arg="../fleet/$repo"
            if [ "$deep" = 'true' ]; then
              case "$annot" in deep=*) arg="$arg:${annot#deep=}" ;; esac
            fi
            printf '%s\n' "$arg" >> ../fleet/canary-args.txt
          done < tools/fleet-manifest.txt
          if [ ! -s ../fleet/canary-args.txt ]; then
            echo "::error::fleet-canary: no fleet repo could be cloned — nothing to validate"
            exit 1
          fi
          echo 'fleet-canary args:'
          cat ../fleet/canary-args.txt

      # Consumer builds may resolve dependencies from GitHub Packages; same
      # credential names as build.yml / check-pr.yml / gradle_plugin_publish.yml.
      # tee keeps the output for the artifact; pipefail makes the workflow FAIL
      # whenever fleet-canary.sh exits non-zero.
      - name: Fleet canary
        env:
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
        run: |
          set -euo pipefail
          mapfile -t args < ../fleet/canary-args.txt
          {
            if [ -s ../fleet/not-validated.txt ]; then
              echo 'fleet-canary: NOT VALIDATED this run (clone failed — see warnings):'
              sed 's/^/  /' ../fleet/not-validated.txt
            fi
            tools/fleet-canary.sh "${args[@]}" 2>&1
          } | tee fleet-canary-output.txt

      # The canary record for the release: which repos and suites were
      # validated, and every advisory reprinted — a prior review found that
      # unknowable after the fact. Uploaded on failure too; a red canary's
      # record is the one most worth reading.
      - name: Upload canary record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-canary-${{ github.event.pull_request.head.sha || github.sha }}
          path: fleet-canary-output.txt
          if-no-files-found: warn
