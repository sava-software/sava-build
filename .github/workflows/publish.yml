name: Publish Release

on:
  workflow_call:
    inputs:
      maven-central-exclude-checksums:
        description: 'Comma-separated checksum types to exclude from the Maven Central bundle on top of the default, which drops sha256 and, from sava-build 21.6.0, sha512 (Central requires md5 and sha1). Leave empty for the default.'
        required: false
        type: string
        default: ''
    secrets:
      READ_SAVA_PACKAGES:
        description: Token used to read sava GitHub Packages.
        required: false
      GPG_PUBLISH_SECRET:
        description: GPG secret key used to sign published artifacts.
        required: true
      GPG_PUBLISH_PHRASE:
        description: Passphrase for the GPG signing key.
        required: true
      MAVEN_CENTRAL_TOKEN:
        description: Token used to publish to Maven Central.
        required: true
      MAVEN_CENTRAL_SECRET:
        description: Secret used to publish to Maven Central.
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    # The tag reaches the scripts below only through this variable, never pasted
    # into a run script: release-please cuts it from the merged release PR's title,
    # which a Release-As commit footer or a title edit sets.
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # First, before checkout, setup or any secret-bearing step: publish only a
      # tag push whose name is a plain X.Y.Z release version.
      - name: Validate release tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        # Fail-closed: under sh a negated test would let a malformed check pass.
        # Digits are listed, not ranged, so no locale widens what they match.
        run: |
          release_tag_re='^(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)$'
          [[ "$REF_TYPE" == tag ]] || { echo "::error::Publishing runs only on a release tag push; this run's ref type is '$REF_TYPE'."; exit 1; }
          [[ "$RELEASE_TAG" =~ $release_tag_re ]] || { echo "::error::Refusing to publish tag '$RELEASE_TAG': a release tag is a plain X.Y.Z version (digits only, no leading zeros, no prefix or suffix)."; exit 1; }

      - id: setup
        uses: sava-software/sava-build@main
        with:
          default-java-version: ${{ vars.JAVA_VERSION }}
          jdk-src: ${{ vars.JDK_SRC }}
          gradle-java-version: ${{ vars.GRADLE_JAVA_VERSION }}

      - name: Check
        run: ./gradlew --stacktrace -Psign=true -PjavaVersion="$SETUP_JAVA_VERSION" -Pversion="$RELEASE_TAG" check
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      # 'publishAggregationToCentralPortal' is the deprecated alias of
      # 'publishCentralPortalDeployment'. Consumers use this workflow @main while their
      # builds pin older sava-build plugin versions, and the alias is the only task name
      # that exists in both generations. Switch to the new name once every consumer
      # repository using this workflow is on a plugin version that provides
      # 'publishCentralPortalDeployment'.
      - name: Maven Central
        run: ./gradlew --stacktrace -Psign=true -PjavaVersion="$SETUP_JAVA_VERSION" -Pversion="$RELEASE_TAG" -PmavenCentralExcludeChecksums="$MAVEN_CENTRAL_EXCLUDE_CHECKSUMS" :aggregation:publishAggregationToCentralPortal
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          MAVEN_CENTRAL_EXCLUDE_CHECKSUMS: ${{ inputs.maven-central-exclude-checksums }}
          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_CENTRAL_SECRET: ${{ secrets.MAVEN_CENTRAL_SECRET }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}

      - name: Github Packages
        run: ./gradlew --stacktrace -Psign=true -PjavaVersion="$SETUP_JAVA_VERSION" -Pversion="$RELEASE_TAG" :aggregation:publishToGitHubPackages
        env:
          SETUP_JAVA_VERSION: ${{ steps.setup.outputs.java-version }}
          GPG_PUBLISH_SECRET: ${{ secrets.GPG_PUBLISH_SECRET }}
          GPG_PUBLISH_PHRASE: ${{ secrets.GPG_PUBLISH_PHRASE }}
          ORG_GRADLE_PROJECT_savaGithubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPassword: ${{ secrets.READ_SAVA_PACKAGES }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPublishUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_savaGithubPackagesPublishPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: '**/build/libs/*.jar'
