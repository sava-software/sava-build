name: 'Docker Multi-Arch Setup'
description: 'Container registry login, QEMU, and Buildx setup shared across sava services.'

inputs:
  registry:
    description: 'Container registry to log in to.'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Registry username (defaults to github.actor).'
    required: false
    default: ${{ github.actor }}
  password:
    description: 'Registry password or token (e.g. secrets.GITHUB_TOKEN for ghcr.io, or the gcp-auth access_token output for Artifact Registry).'
    required: true
  qemu_platforms:
    description: 'Comma-separated QEMU platforms to install emulation for. Empty = action default (all).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

    - name: Log in to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
