name: Set up a checked JDK
description: >-
  oracle-actions/setup-java with the eMudhra incident (CVE-2026-91403) closed around it. On Linux
  it first distrusts the roots the compromised intermediates chain to in the runner's OS store,
  which the preinstalled Temurin JDKs read; then it checks the runner JDK that oracle-actions/setup-java downloads with
  (JAVA_HOME_21_X64, or JAVA_HOME_21_arm64), installs the requested JDK, and checks that one. Both
  checks fail closed, so a runner whose bundled JDK still trusts the compromised chains (a macOS
  or Windows image, where the OS store is not the JDK's) stops here instead of downloading over an
  untrusted connection. The distrust-compromised-roots and check-jdk-trust actions beside this one
  are the same scripts, for a JDK installed some other way; check-jdk-trust/chains/README.md has
  the facts of the incident.
inputs:
  website:
    description: oracle-actions/setup-java's website input (oracle.com or jdk.java.net).
    required: true
  release:
    description: >-
      oracle-actions/setup-java's release input, a feature release number, 21 or later: check.sh compiles
      the trust check with the installed JDK at --release 21.
    required: true
runs:
  using: composite
  steps:
    # By name, before the JDK downloads: check.sh compiles with the installed JDK at --release 21,
    # a composite's required inputs are not enforced at run time, and the website is a host name,
    # as sava-build's root action checks it.
    - name: Refuse an empty or malformed input or a release below 21
      shell: bash
      env:
        WEBSITE: ${{ inputs.website }}
        RELEASE: ${{ inputs.release }}
      run: |
        [[ "$WEBSITE" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::setup-checked-jdk: website ('$WEBSITE') is empty or not a host name; the sava workflows take it from vars.JDK_SRC."; exit 1; }
        [ -n "$RELEASE" ] || { echo "::error::setup-checked-jdk: release is empty; the sava workflows take it from vars.JAVA_VERSION or vars.GRADLE_JAVA_VERSION, as the step names it."; exit 1; }
        bash "$GITHUB_ACTION_PATH/../check-jdk-trust/release-floor.sh" "$RELEASE"
    - name: Distrust the compromised intermediates' roots in the OS trust store
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../distrust-compromised-roots/distrust.sh"
    # downloader-jdk.sh mirrors the pinned oracle-actions/setup-java's own choice of JDK;
    # SetupCheckedJdkPinTest in sava-build ties the two together.
    - name: Check the runner JDK that downloads
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/downloader-jdk.sh"
    - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
      with:
        website: ${{ inputs.website }}
        release: ${{ inputs.release }}
    - name: Check the installed JDK
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../check-jdk-trust/check.sh" "$JAVA_HOME"
