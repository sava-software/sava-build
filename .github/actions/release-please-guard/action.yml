name: Release Please guard
description: >-
  Fails when a conventional commit since the last release cannot be read by the parser
  release-please uses, which would otherwise drop it from the release notes at debug level,
  and when release-please would tag a merged release pull request with anything but the
  plain X.Y.Z version the pull request wrote into the manifest. Run on a full-history
  checkout before release-please.
inputs:
  config-file:
    description: release-please config, read for the tag spelling of the last release.
    default: release-please-config.json
  manifest-file:
    description: release-please manifest, read for the last released version.
    default: .release-please-manifest.json
  token:
    description: >-
      Token for the GitHub API: reads the pull requests and the files release-please reads
      (pull-requests and contents read), and the releases API when no tag matches the
      manifest version.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install release-please and its commit parser
      shell: bash
      # The lockfile pins release-please and @conventional-commits/parser to the versions
      # release-please-action bundles, and package.json's overrides pin node-html-parser
      # and its dependencies to the action's; bump them with the action. guard.test.mjs
      # (node --test) covers the script.
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
    - name: Refuse commits release-please would drop, and release versions that are not X.Y.Z
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        MANIFEST_FILE: ${{ inputs.manifest-file }}
        GH_TOKEN: ${{ inputs.token }}
        # release-please targets the default branch unless told otherwise.
        TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/guard.js"
