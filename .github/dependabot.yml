# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Etc/UTC"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Etc/UTC"
    # Group updates for actions maintained together, across all directories above.
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      gradle-actions:
        patterns:
          - "gradle/actions*"
