# Versions used by convention defaults, this build and its TestKit fixtures.
# Dependabot scans this catalog; aliases for generated defaults and fixtures identify
# their modules without adding those dependencies to the plugin's own classpath.

[versions]
pitest = "1.30.0"
pitest-junit5-plugin = "1.2.3"
jazzer = "0.30.0"
arcmutate-base = "1.7.2"
jmh = "1.37"
junit = "6.1.3"
gradlex-java-module-dependencies = "1.13.2"
google-cloud-kms = "2.103.0"
google-gax = "2.88.0"
grpc-xds = "1.83.0"

[libraries]
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin" }
jazzer = { module = "com.code-intelligence:jazzer", version.ref = "jazzer" }
arcmutate-base = { module = "com.arcmutate:base", version.ref = "arcmutate-base" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-bytecode = { module = "org.openjdk.jmh:jmh-generator-bytecode", version.ref = "jmh" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
gradlex-java-module-dependencies = { module = "org.gradlex:java-module-dependencies", version.ref = "gradlex-java-module-dependencies" }
google-cloud-kms = { module = "com.google.cloud:google-cloud-kms", version.ref = "google-cloud-kms" }
google-gax = { module = "com.google.api:gax", version.ref = "google-gax" }
google-gax-grpc = { module = "com.google.api:gax-grpc", version.ref = "google-gax" }
grpc-xds = { module = "io.grpc:grpc-xds", version.ref = "grpc-xds" }
