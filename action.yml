name: 'Setup Java and Gradle'
description: >-
  Checks out the repository, sets up Gradle and installs the Oracle JDKs the build and Gradle run on,
  with the eMudhra incident's trust checks (CVE-2026-91403) of .github/actions/setup-checked-jdk around
  the installs, run from this action's own checkout so that a caller pinned by SHA stays pinned
  throughout. The checks need a runner whose JAVA_HOME_21_X64 or JAVA_HOME_21_arm64 JDK does not trust
  the compromised chains: GitHub's Ubuntu images do not once the OS store is fixed here, a macOS
  image not until its Temurin 21 is patched, and a runner without the variable stops at the check
  as one whose JDK still trusts them does (a Windows runner is unverified: check.sh looks for
  bin/java and bin/javac). Out of reach: the runner fetches the actions themselves at job setup,
  before any step and so over the unfixed store, and Node-based actions such as setup-gradle use
  Node's bundled store. Java 21 is the floor of the versions installed: the check compiles with the
  installed JDK at --release 21.

inputs:
  default-java-version:
    description: "Default Java version, 21 or later (setup-checked-jdk compiles its trust check with the installed JDK at --release 21). Empty on a pull request from a fork, which receives no configuration variables: javaVersion in gradle/sava.properties is used there."
    required: true
  jdk-src:
    description: "JDK download site. Empty on a pull request from a fork: oracle.com is used there."
    required: true
  gradle-java-version:
    description: "Java version Gradle runs on, 21 or later. Empty on a pull request from a fork: javaVersion in gradle/sava.properties is used there."
    required: true
  cache-disabled:
    description: "Passed to setup-gradle. A publishing job sets 'true': nothing an earlier build, tests included, left in the Gradle cache reaches the job that signs."
    required: false
    default: 'false'
  release-manifest:
    description: "release-please's manifest, as release-please.yml's manifest-file names it. On a tag ref the tag must be the version it names; a repository without the default one is not checked."
    required: false
    default: '.release-please-manifest.json'
  persist-credentials:
    description: "Passed to actions/checkout. A publishing job sets 'false', so checkout persists no git credential for later steps (checkout v6 and later would write the job token to a file under RUNNER_TEMP that the repository's git config includes). The GitHub Packages step still passes the job token to Gradle, which needs it to publish."
    required: false
    default: 'true'

outputs:
  java-version:
    description: "Java version"
    value: ${{ steps.java-version.outputs.java-version }}

runs:
  using: "composite"
  steps:
    # Under pull_request_target the checkout below resolves the BASE branch, so
    # every consumer of this action would silently validate main instead of the
    # PR. Refuse loudly — trigger on pull_request instead.
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::sava-build's setup action was invoked from a pull_request_target event: checkout resolves the base branch, so the PR's changes are never built. Trigger on pull_request instead."
        exit 1
    # Branch and tag names are attacker-reachable text: a fork names its own branch
    # (github.head_ref), and release-please cuts the tag from the merged release PR's
    # title, which a Release-As commit footer or a title edit sets. No github.* or
    # inputs.* value is pasted into a run script in this action; each one arrives
    # through env. A tag must also be a plain X.Y.Z release version, checked here
    # before anything is checked out.
    - name: Validate release tag
      if: github.ref_type == 'tag'
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        release_tag_re='^(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)\.(0|[123456789][0123456789]*)$'
        [[ "$REF_NAME" =~ $release_tag_re ]] || { echo "::error::Refusing tag '$REF_NAME': a release tag is a plain X.Y.Z version (digits only, no leading zeros, no prefix or suffix)."; exit 1; }
    # The eMudhra incident's trust checks (CVE-2026-91403) of .github/actions/setup-checked-jdk, run
    # from this action's own checkout: $GITHUB_ACTION_PATH is this action at the caller's ref, so a
    # caller pinned by SHA stays pinned, where a nested `uses` of the wrapper would resolve
    # sava-build's main (release-please.yml, a reusable workflow with no such path, uses it at
    # @main). Before the checkout, which git fetches over the OS store on a Linux runner: the roots
    # are distrusted there first, then the runner JDK that oracle-actions/setup-java downloads with
    # is checked, once for both installs; each installed JDK is checked below. SetupCheckedJdkPinTest
    # ties the pins and the scripts here to the wrapper's.
    # The inputs by shape, before anything runs (input-shape.sh says what shape): a value that
    # is present is refused here by name; an empty one is left to the version step after the
    # checkout, which fills it from gradle/sava.properties for a pull request from a fork and
    # checks the result with the same script. default-java-version is left to that step
    # entirely: a tag's major or a java-NN branch name supersedes it, so the input is not what
    # the run uses, and a floor on it would refuse a run that never installs it.
    - name: Refuse a malformed input
      shell: bash
      env:
        GRADLE_JAVA_VERSION: ${{ inputs.gradle-java-version }}
        JDK_SRC: ${{ inputs.jdk-src }}
      run: |
        bash "$GITHUB_ACTION_PATH/.github/actions/check-jdk-trust/input-shape.sh" --present \
          "jdk-src (vars.JDK_SRC)" "$JDK_SRC" \
          "gradle-java-version (vars.GRADLE_JAVA_VERSION)" "$GRADLE_JAVA_VERSION"
    - name: Distrust the compromised intermediates' roots in the OS trust store
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/distrust-compromised-roots/distrust.sh"
    - name: Check the runner JDK that downloads
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/setup-checked-jdk/downloader-jdk.sh"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
    # release-please writes the version into .release-please-manifest.json in the release
    # pull request and tags that pull request's merge commit, so a release tag must name the
    # version its own commit's manifest holds. This reads only the tagged commit, which nothing
    # can change afterwards, so it holds whatever happened while the tag was cut.
    # A repository without the default manifest is not checked; a manifest named otherwise
    # must exist. jq compares exactly, and fails on anything but one JSON object.
    - name: Check the tag against the release manifest
      if: github.ref_type == 'tag'
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
        MANIFEST: ${{ inputs.release-manifest }}
      run: |
        if [ ! -f "$MANIFEST" ] && [ "$MANIFEST" = .release-please-manifest.json ]; then
          echo "No $MANIFEST at the tagged commit: the tag is not checked against a release manifest."
          exit 0
        fi
        if ! jq -e -n --arg tag "$REF_NAME" '[inputs] | length == 1 and (.[0] | type) == "object" and .[0]["."] == $tag' "$MANIFEST" > /dev/null; then
          named=$(jq -c -n '[inputs][0]["."]' "$MANIFEST" 2> /dev/null) || named='nothing readable'
          echo "::error::Tag '$REF_NAME' is not the version the tagged commit's $MANIFEST names ($named): release-please tags a release pull request's merge commit with the version that pull request wrote there."
          exit 1
        fi
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      with:
        cache-disabled: ${{ inputs.cache-disabled }}

    - name: Extract Java version from branch
      id: java-version
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        DEFAULT_JAVA_VERSION: ${{ inputs.default-java-version }}
        GRADLE_JAVA_VERSION: ${{ inputs.gradle-java-version }}
        JDK_SRC: ${{ inputs.jdk-src }}
        LC_ALL: C
      run: |
        # A pull request from a fork receives no configuration variables, so the
        # vars.* inputs arrive empty there: it falls back to the repository's
        # gradle/sava.properties and the default JDK site. Any other run must get them.
        fork_pr=false
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
          fork_pr=true
        fi
        # The last javaVersion entry of gradle/sava.properties, '=' or ':' separated.
        project_java_version() {
          [ -f gradle/sava.properties ] || return 0
          tr -d '\r' < gradle/sava.properties |
            sed -nE 's/^[[:space:]]*javaVersion[[:space:]]*[=:][[:space:]]*([^[:space:]]+).*$/\1/p' |
            tail -n 1
        }

        if [ "$REF_TYPE" = "tag" ]; then
          TAG_NAME="$REF_NAME"
          echo "Tag: $TAG_NAME"
          # The tag passed the X.Y.Z check above, so its major is the Java version.
          JAVA_VERSION=${TAG_NAME%%.*}
        else 
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_NAME="$HEAD_REF"
          else
            BRANCH_NAME="$REF_NAME"
          fi
          echo "Branch: $BRANCH_NAME"
        
          # Extract Java version from branch name (e.g., java-21, java-25)
          JAVA_VERSION=$(echo "$BRANCH_NAME" | grep -oE 'java-([0-9]+)' | grep -oE '[0-9]+' || true)
        
          # Fallback to default if no version found in branch name
          if [ -z "$JAVA_VERSION" ]; then
            JAVA_VERSION="$DEFAULT_JAVA_VERSION"
            if [ -z "$JAVA_VERSION" ] && [ "$fork_pr" = true ]; then
              JAVA_VERSION=$(project_java_version)
              if [ -n "$JAVA_VERSION" ]; then
                echo "::notice::vars.JAVA_VERSION does not reach pull requests from forks: using javaVersion '$JAVA_VERSION' from gradle/sava.properties."
              fi
            fi
            echo "No Java version found in branch name, using default: $JAVA_VERSION"
          fi
        fi

        if [ -z "$GRADLE_JAVA_VERSION" ] && [ "$fork_pr" = true ]; then
          # The project's own version, never one a fork's branch name picked.
          GRADLE_JAVA_VERSION=$(project_java_version)
          if [ -n "$GRADLE_JAVA_VERSION" ]; then
            echo "::notice::vars.GRADLE_JAVA_VERSION does not reach pull requests from forks: running Gradle on javaVersion '$GRADLE_JAVA_VERSION' from gradle/sava.properties."
          fi
        fi
        if [ -z "$JDK_SRC" ] && [ "$fork_pr" = true ]; then
          JDK_SRC=oracle.com
          echo "::notice::vars.JDK_SRC does not reach pull requests from forks: downloading JDKs from $JDK_SRC."
        fi

        # Fail here by name, not later in setup-java ("Could not find website for"): the values
        # as worked out above, every one now required, by the one script the step before the
        # checkout ran on what was present, floor included.
        bash "$GITHUB_ACTION_PATH/.github/actions/check-jdk-trust/input-shape.sh" --all \
          "jdk-src (vars.JDK_SRC)" "$JDK_SRC" \
          "default-java-version (vars.JAVA_VERSION, a java-NN branch name holding one number, or javaVersion in gradle/sava.properties)" "$JAVA_VERSION" \
          "gradle-java-version (vars.GRADLE_JAVA_VERSION)" "$GRADLE_JAVA_VERSION"

        {
          echo "java-version=$JAVA_VERSION"
          echo "gradle-java-version=$GRADLE_JAVA_VERSION"
          echo "jdk-src=$JDK_SRC"
        } >> "$GITHUB_OUTPUT"
        echo "Downloading JDK $JAVA_VERSION from $JDK_SRC."

    # Each install through the pinned oracle-actions/setup-java, checked once installed; the OS
    # store and the runner JDK were checked above, before the checkout.
    - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
      if: ${{ steps.java-version.outputs.gradle-java-version != steps.java-version.outputs.java-version }}
      with:
        website: ${{ steps.java-version.outputs.jdk-src }}
        release: ${{ steps.java-version.outputs.gradle-java-version }}

    - name: Check the installed Gradle JDK
      if: ${{ steps.java-version.outputs.gradle-java-version != steps.java-version.outputs.java-version }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/check-jdk-trust/check.sh" "$JAVA_HOME"

    - run: |
        printf "\norg.gradle.java.home=%s" "$JAVA_HOME" >> gradle.properties
        java --version
      shell: bash
      if: ${{ steps.java-version.outputs.gradle-java-version != steps.java-version.outputs.java-version }}

    - uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
      with:
        website: ${{ steps.java-version.outputs.jdk-src }}
        release: ${{ steps.java-version.outputs.java-version }}

    - name: Check the installed JDK
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/check-jdk-trust/check.sh" "$JAVA_HOME"

    - run: printf "\norg.gradle.java.home=%s" "$JAVA_HOME" >> gradle.properties
      shell: bash
      if: ${{ steps.java-version.outputs.gradle-java-version == steps.java-version.outputs.java-version }}

    - name: Set Java Home
      shell: bash
      run: |
        printf "\norg.gradle.java.installations.paths=%s" "$JAVA_HOME" >> gradle.properties
        java --version

    # Consumers have no Gradle dependency verification yet (sava-build does): a warning on every run,
    # here in the setup every consumer workflow shares, until the fleet carries
    # gradle/verification-metadata.xml, then an error; notice.sh says what it reads, with the JDK
    # installed above, and fails the step when that JDK cannot run its properties reader.
    - name: Dependency verification metadata
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/dependency-verification/notice.sh"
